server:
  port: 9205

spring:
  application:
    name: opinionflow-rag
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yml
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spider?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Milvus 配置
milvus:
  enabled: true
  host: 127.0.0.1
  port: 19530
  collection-name: news_vectors

# 日志配置
logging:
  level:
    com.lespider.opinionflow.rag: DEBUG
    io.milvus: INFO