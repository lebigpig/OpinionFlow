# Gradle JVM 参数
# 注意：不能设 -Dfile.encoding=UTF-8！否则 Gradle daemon 会用 UTF-8 解码子进程输出流，
# 导致 Logback 输出的 GBK 中文被错误解码成问号。Gradle daemon 应用系统默认编码（GBK）。
org.gradle.jvmargs=-Xmx2048m

# 禁用 Kotlin 编译器 daemon，避免中文路径下 dirty-sources.txt 文件锁定问题
kotlin.daemon.enabled=false

# 并行构建
org.gradle.parallel=true

# 开启构建缓存
org.gradle.caching=true
