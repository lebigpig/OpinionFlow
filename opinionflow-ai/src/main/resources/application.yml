server:
  port: 9202

spring.cloud.compatibility-verifier:
  enabled: false

spring:
  config:
    import: optional:file:./key.properties,optional:file:../key.properties
  application:
    name: opinionflow-ai
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spider?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 3
      password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        import-check:
          enabled: false

# AI 服务配置
opinionflow:
  ai:
    api-url: ${opinionflow.ai.api-url}
    api-key: ${opinionflow.ai.api-key}
    model: ${opinionflow.ai.model}
  rag:
    enabled: true
    top-k: 5
    max-distance: 50.0
    context-prefix: "以下是与用户问题相关的新闻资料，供你参考分析："
  # Tavily 联网搜索服务配置
  tavily:
    enabled: true
    api-key: ${tavily.api-key:}
    base-url: ${tavily.base-url:https://api.tavily.com}
    max-results: 12
    search-depth: advanced

# Feign 配置（SSE 流式支持）
spring.cloud.openfeign.client.config:
  default:
    connect-timeout: 5000
    read-timeout: 120000
    logger-level: full

logging:
  level:
    com.lespider.opinionflow: debug
    com.alibaba.cloud.nacos: info