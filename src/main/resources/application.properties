spring.application.name=OpinionFlow
# 从根目录 key.properties 加载敏感配置（api-key、脚本路径等）
spring.config.import=file:./key.properties

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/spider?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Redis（本地，db3）──
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.database=3

# 让 400/500 响应里包含 message（便于前端显示具体原因）
server.error.include-message=always

# 脚本运行开关（路径配置已移至 key.properties）
opinionflow.scripts.enabled=true