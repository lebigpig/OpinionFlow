spring.application.name=OpinionFlow
# 从根目录 key.properties 加载敏感配置（api-key、脚本路径等）
spring.config.import=file:./key.properties

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/spider?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Redis（本地，db3）──
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.database=3

# 让 400/500 响应里包含 message（便于前端显示具体原因）
server.error.include-message=always

# 脚本运行开关（路径配置已移至 key.properties）
opinionflow.scripts.enabled=true

# Milvus 向量数据库
milvus.host=127.0.0.1
milvus.port=19530

# ── RAG（检索增强生成）──
# 是否启用 RAG（用户消息向量化 → Milvus 检索相关新闻 → 注入 system prompt）
opinionflow.rag.enabled=true
# Milvus 集合名称（需与 MilvusNewsImportService 中一致）
opinionflow.rag.collection-name=news_vectors
# 返回最相似的新闻条数
opinionflow.rag.top-k=5
# 相似度阈值（L2 距离，低于此值才纳入；越大越宽松）
opinionflow.rag.max-distance=50.0
# 注入到 system prompt 的前缀说明
opinionflow.rag.context-prefix=以下是与用户问题相关的新闻资料，供你参考分析：
